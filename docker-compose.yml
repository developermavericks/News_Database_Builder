version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
    container_name: nexus_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      SECRET_KEY: ${SECRET_KEY:-nexus_local_dev_key_2026}
      HARDWARE_PROFILE: 64GB
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./backend
    container_name: nexus_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=32 --time-limit=1800 --soft-time-limit=1500
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      HARDWARE_PROFILE: 64GB
      SECRET_KEY: ${SECRET_KEY:-nexus_local_dev_key_2026}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build:
      context: ./backend
    container_name: nexus_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      HARDWARE_PROFILE: 64GB
      SECRET_KEY: ${SECRET_KEY:-nexus_local_dev_key_2026}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: nexus_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
